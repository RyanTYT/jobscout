# master_resume/resume.yaml — THE source of truth (PLAN §5.1).
#
# Rules:
#   * Every claimable fact is a row with a STABLE ID (EXP1-B2, PRJ1-B1, ...).
#     IDs are referenced by tailoring, cover letters, and the claim-check gate.
#     NEVER renumber or reuse IDs; add new ones instead.
#   * `metrics:` arrays are claim-check anchors — keep them precise and true.
#   * Bump `version:` when content meaningfully changes (re-keys the score cache).
#   * Validate after every edit:  jobscout resume validate
#
# This skeleton passes validation with placeholders. Replace every "…" / null.

version: 4

identity:
  full_name: "Jane Doe"
  preferred_name: null
  email: "jane@example.com"
  phone: null
  location:
    city: null
    region: null
    country: null
    timezone: "…"
  links:                      # ← the personal-website section
    personal_website: null
    linkedin: null
    github: null
    extra: []
    # - id: L1
    #   label: blog
    #   url: https://…

work_authorization: []
# - country: "US"
#   status: "citizen"            # citizen | permanent-resident | visa-holder | other
#   sponsorship_needed: false
#   note: "…"

education:
- id: EDUCUR                    # highest degree (profile editor)
  school: "NUS"
  degree: "BS"
  field: null
  dates: {start: "", end: null}
  gpa: null
  honors: []
  highlights: []
