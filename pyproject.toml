[project]
name = "jobscout"
version = "0.1.0"
description = "Cost-effective daily AI job-hunt pipeline: agent-driven discovery, dark-pool company tracking, grounded application packets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
# resume rendering (jobscout/core/resume_pdf.py): markdown -> styled HTML via
# `markdown`, HTML -> PDF via WeasyPrint. Both are imported lazily inside the
# functions, so the app and the rest of the CLI run without them — only
# `jobscout resume pdf` / `render_docx` need this extra. Pandoc is optional
# and external; render_docx falls back to HTML when it is absent.
resume = [
    "markdown>=3.6",
    "weasyprint>=62",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
all = ["jobscout[web,resume,dev]"]

[project.scripts]
jobscout = "jobscout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobscout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
