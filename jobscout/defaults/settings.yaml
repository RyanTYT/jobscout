# jobscout settings — runtime behaviour. The discovery mode switch lives here
# (and is surfaced as a toggle on the dashboard Discovery page, PLAN §1.1/§7).

discovery:
  # off      : nothing runs automatically
  # pipeline : deterministic sources + cheap LLM scoring only (~$1/mo)
  # agent    : morning agent rides ON TOP of the always-running pipeline
  # hybrid   : agent N days/week + on-demand runs on signal spikes
  mode: "hybrid"

  agent:
    schedule: weekdays      # daily | weekdays | mon-wed-fri | manual
    max_steps: 60           # tool-call budget per morning run
    max_cost_usd: 0.50      # hard stop, recorded in the runs table
    model: agent            # key into config/models.yaml -> tiers
    run_on_signal: true     # extra runs when pipeline detects anomalies

  pipeline:
    ats_boards: true
    careers_crawl: true
    cse_queries_per_day: 10
    rss: true
    rss_feeds: []             # empty -> defaults (techcrunch funding/fintech, coindesk)

dashboard:
  host: 127.0.0.1
  port: 8787

sidecar:                    # JobPilot — the hands (PLAN §6.2, Phase 7)
  enabled: false            # false until P7 integration lands
  path: ../JobPilot
  command: npm run dev      # run inside scraper/ (or point at the SEA binary later)

llm:
  provider: openai-compatible
  base_url_env: JOBSCOUT_LLM_BASE_URL
  api_key_env: JOBSCOUT_LLM_API_KEY

run:
  daily_hour: 6             # launchd com.jobscout.daily StartCalendarInterval
  daily_minute: 30
  agent_hour: 7             # launchd com.jobscout.agent (installed via --with-agent)
  agent_minute: 0
  skip_if_run_within_hours: 20   # idempotency: skip when last good run is fresh
