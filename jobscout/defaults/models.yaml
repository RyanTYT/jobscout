# LLM tiers — three tiers, three jobs (PLAN §1). Provider-agnostic:
# every model is served through the OpenAI-compatible endpoint in settings/llm.
# Set your model slugs + prices below. Prices are only used by the spend
# meter (llm_calls table, daily caps); tokens are metered regardless.

tiers:
  bulk:
    model: ~deepseek/deepseek-v4-flash-latest
    max_daily_usd: 0.25
    purpose: bulk scoring, field mapping, claim checks (cached by content hash)
    # approximate prices — update to your provider's current pricing (USD per 1M tokens)
    price_in_per_mtok: 0.01
    price_out_per_mtok: 0.40

  agent:
    model: ~deepseek/deepseek-v4-flash-latest
    max_daily_usd: 1.00
    purpose: morning discovery harness (step+cost capped, PLAN §1.2)
    price_in_per_mtok: 0.01
    price_out_per_mtok: 0.40

  quality:
    model: deepseek/deepseek-v4-pro
    max_daily_usd: 2.00
    purpose: resume tailoring, cover letters, profile distillation
    price_in_per_mtok: 0.96
    price_out_per_mtok: 1.91

caps:
  monthly_usd: 15.0
  on_cap: rule-only        # degrade to deterministic scoring, note in digest footer
